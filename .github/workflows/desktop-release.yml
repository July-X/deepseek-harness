# Build and publish the dsh-desktop shell for the supported desktop targets.
#
# Platforms (deliberately scoped to the two requested targets):
#   * Intel macOS  -> macos-15-intel runner (x86_64) produces .dmg
#                     (macos-13 was retired 2025-12; macos-15-intel is the
#                     last x86_64 macOS image, available until 2027-08)
#   * Windows      -> windows-latest runner (x86_64) produces installer + exe
#
# Trigger by pushing a tag `desktop-v<version>` on the develop branch whose
# version matches `desktop/package.json` (and `src-tauri/tauri.conf.json` —
# the verify step below fails the run otherwise), or run it manually from the
# Actions tab on develop. Tags pointing at commits outside develop (e.g.
# master) and dispatches on any other ref are rejected by the verify step:
# releases only ever ship from develop.
# Releases are created as drafts so a human publishes them; the same draft is
# appended on re-runs of the same tag.

name: Desktop release (dsh-desktop)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify the tag matches the app version and sits on develop
        id: meta
        shell: pwsh
        run: |
          # Releases ship only from develop: a tag must name a commit that is
          # reachable from origin/develop, and a manual dispatch must select
          # the develop ref. (checkout gives us the tagged commit detached;
          # deepen the develop fetch so ancestry is decidable for tags that
          # are not develop's head.)
          if ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME -ne 'develop') {
            throw "desktop releases only run on develop; dispatched ref was $env:GITHUB_REF_NAME"
          }
          git fetch --depth=100 origin develop
          git merge-base --is-ancestor HEAD FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "tag $env:GITHUB_REF_NAME does not point at a commit on develop"
          }

          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pkg = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $pkg.version) {
            throw "version mismatch: tauri.conf.json ($($conf.version)) != package.json ($($pkg.version))"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "desktop-v$($conf.version)") {
            throw "tag $env:GITHUB_REF_NAME does not match desktop version $($conf.version)"
          }
          "prerelease=$(([bool]($conf.version -match '-')).ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # desktop/ is deliberately outside the pnpm workspace; without
      # --ignore-workspace pnpm walks up to the monorepo root (see
      # desktop/AGENTS.md).
      - name: Install the Tauri CLI
        run: pnpm install --ignore-workspace
        working-directory: desktop

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json + .sig files) that the
          # in-app updater verifies against the pubkey in tauri.conf.json.
          # The key has no password; the empty password env still must exist.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'deepseek-harness 桌面端 v__VERSION__'
          releaseBody: |
            ## deepseek-harness 桌面端 v__VERSION__

            支持平台：
            - Intel macOS（.dmg）
            - Windows x86_64（NSIS 安装包 .exe）

            使用方式：安装后在「内核版本」页安装并切换 deepseek-harness 内核版本即可使用。
          releaseDraft: false
          # Mark every shell release as a normal release on GitHub
          # (not a prerelease) so the `/releases/latest/download/
          # latest.json` endpoint that tauri.conf.json
          # `plugins.updater.endpoints` points at is resolvable.
          # Earlier versions derived the GitHub prerelease flag from
          # a `-` in the version string (rc.1, rc.2, …) and marked
          # the GitHub release prerelease; GitHub's
          # `/releases/latest` API returns 404 when the latest
          # release is a prerelease, so the in-app updater could
          # never reach latest.json and the manual「检查桌面端更新」
          # button silently reported「桌面端已是最新」. The version
          # string itself is unchanged (still `0.1.0-rc.X` so
          # Semver prerelease ordering keeps working in tauri-plugin-
          # updater's semver comparison) — only the GitHub UI flag
          # flips. See the published comment in 0.1.0-rc.5 for the
          # full reproducer.
          prerelease: false
